name: Publish to Private npm

# needs cannot cross workflow files. Repeat the checks matrix so publication
# is gated by checks from this same tag run, not an earlier branch run.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      matrix:
        # Covers engines: Node 22 (minimum 22.19.0) and Node 24 LTS.
        node: [22.19.0, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npm run check

  publish:
    needs: check
    if: github.repository == 'TokensAPI/tokens_DshLogin_code' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.tokensapi.ai/
      - name: Validate release identity
        run: node scripts/validate-release.mjs "$GITHUB_REF_NAME"
      # dsh/*.js are hand-written runtime assets; there is no build step.
      # The matrix already ran prepack's checks, so skip them when packing.
      - name: Pack and verify release artifact
        run: |
          mkdir -p .release
          npm pack --ignore-scripts --pack-destination .release
          node scripts/verify-package.mjs .release
      - name: 检查 · 发布包检查的只读凭证
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${NODE_AUTH_TOKEN:-}" ]] || { echo '::error::请配置只读 Secret PLUGIN_CHECK_REGISTRY_TOKEN'; exit 1; }
          [[ "$(npm whoami --registry=https://npm.tokensapi.ai/)" == market ]] || { echo '::error::包检查需要 market 只读账号'; exit 1; }
      - name: Publish verified artifact and verify registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::缺少仓库 Secret VERDACCIO_PUBLISH_TOKEN"
            exit 1
          fi
          publisher="$(npm whoami --registry=https://npm.tokensapi.ai/)"
          if [ "$publisher" != "tokenscowork" ]; then
            echo "::error::发布账号必须是 tokenscowork"
            exit 1
          fi
          node scripts/registry-release.mjs preflight
          npm publish .release/*.tgz --ignore-scripts --registry=https://npm.tokensapi.ai/ --tag latest
          node scripts/registry-release.mjs verify .release
      - name: 报告 · 输出已发布的准确版本
        id: package
        run: node -p '"package=" + require("./package.json").name + "@" + require("./package.json").version' >> "$GITHUB_OUTPUT"

  package-check:
    name: 检查 · 插件发布包
    needs: publish
    uses: TokensAPI/tokens_DshPluginCheck_code/.github/workflows/check-plugin-package.yml@e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    with:
      package: ${{ needs.publish.outputs.package }}
      checker_ref: e58ceb1d238101925fe49841e5ccedd7e8eb2c10
    secrets:
      PLUGIN_CHECK_REGISTRY_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
